[discovery_extension_definition]
short_name = "pandorafms.oracle_monitor"
section = "app"
name = "DB Oracle Monitoring"
version = "1.0.6"
description = "ORACLE database monitoring, multiline custom SQL, one DB session per task, and detailed SQL and connection errors in Discovery Summary."
execution_file[_exec1_] = "pandorafms_oracle.py"
exec[] = "/usr/bin/python3 _exec1_ --config '_configFile_' --outdir '__incomingDir__' --lock-file '/tmp/pandorafms-oracle-__taskMD5__.lock' --run-log '_runlog_' --sql-files '_sqlFile1_' '_sqlFile2_' '_sqlFile3_' '_sqlFile4_' '_sqlFile5_' '_sqlFile6_' '_sqlFile7_' '_sqlFile8_' '_sqlFile9_' '_sqlFile10_'"
