[database_target]
macro[1] = _host_
name[1] = "Database hostname / IP"
type[1] = string
placeholder[1] = "db.example.local"
macro[2] = _port_
name[2] = "TCP port"
type[2] = number
placeholder[2] = "1521"
macro[3] = _service_
name[3] = "Oracle service name (PDB/service)"
type[3] = string
placeholder[3] = "ORCLPDB1"
macro[4] = _user_
name[4] = "Monitoring username"
type[4] = string
placeholder[4] = "pandora_monitor"
macro[5] = _password_
name[5] = "Monitoring password"
type[5] = password
macro[6] = _agent_
name[6] = "Pandora agent name"
type[6] = string
placeholder[6] = "DB-instance-name"
required_field[6] = false
mandatory_field[6] = false
macro[7] = _group_
name[7] = "Agent group"
type[7] = select
select_data[7] = agent_groups
macro[8] = _modulePrefix_
name[8] = "Module name prefix"
type[8] = string
required_field[8] = false
mandatory_field[8] = false

